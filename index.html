<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="الدروس 1 إلى 5 من DaF kompakt A1 مبسّطة بالعربية، مع النطق الألماني وبطاقات المراجعة ووضع الاستماع.">
<meta name="theme-color" content="#f2f3ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f120c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DaF kompakt">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DaF kompakt مبسّط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: a phone-first study app. One column, app bar on top, tab bar at the bottom, full-screen lesson player. German always set in a serif with color-coded articles; the book's berry and lime are the working colors. */
:root{
  --bg:#f2f3ed; --surface:#ffffff; --sunk:#e8ebe1; --ink:#161b12; --ink-2:#3a4233; --muted:#666f5b; --line:#dde2d2;
  --accent:#9b1b58; --on-accent:#ffffff; --accent-soft:#f6e3ec;
  --hero:#8a1550; --hero-ink:#ffffff; --hero-mute:#f3c7db;
  --ok:#4e7a0e; --ok-soft:#e5eecf; --bad:#b3332a; --bad-soft:#f7e2df;
  --der:#2056a8; --das:#16775a; --die:#c0392b;
  --shadow:0 1px 2px rgba(22,27,18,.05),0 8px 24px rgba(22,27,18,.07);
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-de:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f120c; --surface:#181c13; --sunk:#12150e; --ink:#e8ecdf; --ink-2:#c8cebc; --muted:#99a28b; --line:#2a3023;
  --accent:#f07aae; --on-accent:#2b0717; --accent-soft:#3a1d2b;
  --hero:#45142d; --hero-ink:#fde8f1; --hero-mute:#d79bb8;
  --ok:#a6d14f; --ok-soft:#232f19; --bad:#f08a7e; --bad-soft:#3a1f1c;
  --der:#86adf2; --das:#5fcca4; --die:#f3897a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f120c; --surface:#181c13; --sunk:#12150e; --ink:#e8ecdf; --ink-2:#c8cebc; --muted:#99a28b; --line:#2a3023;
  --accent:#f07aae; --on-accent:#2b0717; --accent-soft:#3a1d2b;
  --hero:#45142d; --hero-ink:#fde8f1; --hero-mute:#d79bb8;
  --ok:#a6d14f; --ok-soft:#232f19; --bad:#f08a7e; --bad-soft:#3a1f1c;
  --der:#86adf2; --das:#5fcca4; --die:#f3897a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:currentColor;stroke:none}
.de{font-family:var(--f-de);direction:ltr;unicode-bidi:isolate;font-size:1.06em}
.g{font-weight:600}.g-der{color:var(--der)}.g-das{color:var(--das)}.g-die{color:var(--die)}
.de.tap{cursor:pointer;border-bottom:1px dotted color-mix(in srgb,var(--muted) 70%,transparent);border-radius:3px;transition:background .15s}
.de.tap:hover{background:var(--accent-soft)}
.de.tap.is-playing{background:var(--accent-soft);border-bottom-color:var(--accent)}
.muted{color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}

/* app shell */
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font-family:var(--f-de);font-weight:700;font-size:19px;letter-spacing:-.01em;direction:ltr;unicode-bidi:isolate}
.brand span{font-size:13px;color:var(--muted)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.sync-dot.on{background:var(--ok)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk)}
#screen{flex:1;padding-inline:16px;padding-block:4px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:9px 8px;font-size:12px;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;min-height:46px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn-ok{background:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn-block{width:100%}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-2)}
.chip-btn .ic{width:18px;height:18px}
.chip-btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.pbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);flex:none;position:relative}
.pbtn .ic{width:19px;height:19px}
.pbtn.is-playing{background:var(--accent);color:var(--on-accent)}
.pbtn.is-playing::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:pulse 1s ease-out infinite}
.pbtn.is-loading{opacity:.6}
.btn.pbtn{width:auto;height:auto;border-radius:12px;display:inline-flex}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}

/* home */
.greet{display:flex;flex-direction:column;gap:0;padding-top:6px}
.greet .de{font-size:30px;font-weight:600;line-height:1.25;width:max-content;max-width:100%;border-bottom:0}
.greet p{color:var(--muted);font-size:14px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--hero-ink) 10%,transparent),transparent 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--hero-mute);flex-wrap:wrap}
.hero-day{font-family:var(--f-de);font-size:54px;font-weight:700;line-height:1;letter-spacing:-.02em;direction:ltr;text-align:right}
.hero h2{font-size:22px;font-weight:700}
.hero p{color:var(--hero-mute);font-size:15px}
.hero .de{color:var(--hero-ink);border-bottom-color:var(--hero-mute)}
.hero .de.tap:hover,.hero .de.tap.is-playing{background:color-mix(in srgb,var(--hero-ink) 14%,transparent)}
.hero .g{color:inherit}
.hero-steps{display:flex;gap:4px;margin-top:4px}
.hero-steps span{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--hero-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-steps span::before{content:"";height:4px;border-radius:2px;background:color-mix(in srgb,var(--hero-ink) 22%,transparent)}
.hero-steps span.on::before{background:var(--hero-ink)}
.btn-hero{background:var(--hero-ink);color:var(--hero);margin-top:6px;font-size:16px;min-height:50px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);min-width:0}
.tile .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;display:flex;align-items:center;gap:6px}
.tile .num .ic{width:22px;height:22px;color:var(--accent)}
.tile small{font-size:12px;color:var(--muted);line-height:1.4}
.ring{width:30px;height:30px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--sunk)}.ring .fg{stroke:var(--ok);stroke-linecap:round}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;direction:ltr}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-family:var(--f-de)}
.week i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--ink-2)}
.week .done i{background:var(--ok);color:var(--surface)}
.week .today i{box-shadow:inset 0 0 0 2px var(--accent)}
.week .today{color:var(--accent);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qa .ic{width:26px;height:26px;color:var(--accent)}
.qa b{font-size:15px}
.qa small{font-size:13px;color:var(--muted);line-height:1.5}
.qa:hover{border-color:var(--accent)}
.say-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.say-card .de{font-size:21px;line-height:1.45;border-bottom:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* course */
.scr-h{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.scr-h h1{font-size:26px;font-weight:700}
.scr-h p{color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.unit{display:flex;flex-direction:column;gap:8px}
.unit-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unit-l{font-family:var(--f-de);font-weight:700;font-size:18px;direction:ltr;unicode-bidi:isolate}
.unit-t{font-family:var(--f-de);color:var(--muted);font-size:15px;direction:ltr;unicode-bidi:isolate}
.unit-c{margin-inline-start:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.days-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.days-list li+li{border-top:1px solid var(--line)}
.day-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px}
.day-row:hover{background:var(--bg)}
.day-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--ink-2);flex:none;font-size:15px}
.day-row.done .day-num{background:var(--ok);color:var(--surface)}
.day-row.cur .day-num{background:var(--accent);color:var(--on-accent)}
.day-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.day-main b{font-weight:600;font-size:15px}
.day-main small{font-size:12px;color:var(--muted)}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill-ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.pill-cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill-res{background:var(--sunk);color:var(--muted)}

/* cards */
.boxes{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.boxes-chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:110px}
.boxes-chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.boxes-chart i{width:100%;max-width:40px;border-radius:6px 6px 2px 2px;background:var(--ok);min-height:3px}
.boxes-chart div:first-child i{background:var(--line)}
.boxes-chart b{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.boxes-legend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:11px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;align-self:flex-start}
.seg button{padding:7px 14px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cs-top{display:flex;align-items:center;gap:12px;padding-top:6px}
.cs-top .bar{flex:1}
.cs-top span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px;text-align:center;cursor:pointer}
.flash .front .de{font-size:clamp(28px,8vw,40px);font-weight:600;line-height:1.25;border-bottom:0}
.flash .front .ar{font-size:26px;font-weight:600}
.flash .back{display:flex;flex-direction:column;align-items:center;gap:6px;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.flash .back .ar{font-size:20px;font-weight:600}
.flash .back .de{font-size:26px;font-weight:600;border-bottom:0}
.flash .pr{color:var(--muted);font-size:14px}
.flash .from{font-size:12px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade-btn{border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.grade-btn small{font-weight:400;font-size:12px;color:var(--muted)}
.grade-btn.no{color:var(--bad)}.grade-btn.no:hover{background:var(--bad-soft)}
.grade-btn.hard{color:var(--ink-2)}.grade-btn.hard:hover{background:var(--sunk)}
.grade-btn.ok{color:var(--ok)}.grade-btn.ok:hover{background:var(--ok-soft)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* listen */
.ls-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;direction:rtl}
.ls-days::-webkit-scrollbar{display:none}
.ls-days button{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:14px}
.ls-days button.on{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.ls-now{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:170px;justify-content:center;box-shadow:var(--shadow)}
.ls-now .de{font-size:clamp(24px,6.5vw,32px);font-weight:600;line-height:1.3;border-bottom:0}
.ls-now .pr{color:var(--muted);font-size:14px}
.ls-now .ar{font-size:17px}
.ls-now .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ls-ctrl{display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr}
.ls-play{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.ls-play .ic{width:30px;height:30px}
.ls-skip{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.ls-skip:hover{background:var(--sunk)}
.ls-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ls-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ls-list li+li{border-top:1px solid var(--line)}
.ls-list button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:start}
.ls-list .n{width:26px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ls-list .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.ls-list .t .de{font-size:16px}
.ls-list .t small{font-size:13px;color:var(--muted)}
.ls-list .cur{background:var(--accent-soft)}
.ls-list .cur .n{color:var(--accent);font-weight:600}

/* lesson player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.pl-head{padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line)}
.pl-head-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.pl-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.pl-title small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-title b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-timer{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;background:var(--sunk);border-radius:999px;padding:4px 10px}
.pl-timer .ic{width:16px;height:16px}
.pl-steps{max-width:720px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:2px 12px 10px}
.pl-step{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center;min-width:0}
.pl-step i{height:4px;border-radius:2px;background:var(--sunk)}
.pl-step.past i{background:var(--ok)}
.pl-step.cur i{background:var(--accent)}
.pl-step.cur{color:var(--accent);font-weight:600}
.pl-step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pl-body-in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
.pl-foot{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.pl-foot-in{max-width:720px;margin:0 auto;display:flex;gap:10px;padding:10px 16px}

const CORE = (function(){
  function stripTags(s){ return s.replace(/<[^>]+>/g,''); }
  function norm(s){
    return stripTags(String(s)).replace(/،/g,',').replace(/\[(der|den|das|die)\]/g,'$1').replace(/\s+/g,' ').trim();
  }
  function spans(s){ const out=[]; String(s).replace(/«([^»]+)»/g,(m,t)=>{ out.push(norm(t)); return m; }); return out; }
  function playable(k){ return /[A-Za-zÄÖÜäöüß]{2,}/.test(k) && k.indexOf('___')<0; }
  /* Fill the blanks of an exercise with its answer to get the full German sentence. */
  function complete(ex){
    const qs = spans(ex.q).filter(k=>k.indexOf('___')>=0);
    if(!qs.length) return null;
    let fills = [];
    spans(ex.a).forEach(k=>{ k.split('…').forEach(p=>{ p=p.trim(); if(p) fills.push(p); }); });
    const blanks = qs.reduce((n,k)=>n+(k.match(/___/g)||[]).length,0);
    if(!blanks || fills.length!==blanks) return null;
    let i=0;
    const done = qs.map(k=>{
      let s = k.replace(/___([.?!,]?)/g,(m,p)=>{ let f=fills[i++]; if(p) f=f.replace(/[.?!]+$/,''); return f+p; });

    });
    return done.join(' – ');
  }

 rule:`<h4>من أين أنت؟ «aus» + البلد</h4>
<p>أغلب البلدان بدون أداة: «Ich komme aus Marokko.» «Er kommt aus Deutschland.»</p>
<p>بعض البلدان لها أداة، فتتغير بعد «aus»:</p>
<div class="tw"><table class="tbl"><thead><tr><th>النوع</th><th>البلد</th><th>بعد aus</th></tr></thead><tbody>
<tr><td>مؤنث</td><td>«[die] Schweiz، [die] Türkei»</td><td>«aus <b>der</b> Schweiz، aus <b>der</b> Türkei»</td></tr>
<tr><td>مذكر</td><td>«[der] Iran، [der] Irak»</td><td>«aus <b>dem</b> Iran، aus <b>dem</b> Irak»</td></tr>
<tr><td>جمع</td><td>«die USA، die Niederlande»</td><td>«aus <b>den</b> USA، aus <b>den</b> Niederlanden»</td></tr>
</tbody></table></div>
<h4>اللغات</h4>
<p>أسماء اللغات تنتهي غالباً بـ «-isch»: «Arabisch، Spanisch، Englisch، Französisch». الاستثناء الأشهر: «Deutsch».</p>
<p>الفعل «sprechen» (يتكلم) يغيّر حرفه مع du وer: «ich spreche، du sprichst، er spricht».</p>
<h4>الدراسة</h4>
<p>«Was studierst du?» – «Ich studiere Informatik.» من التخصصات: «Informatik» معلوميات، «Medizin» طب، «Wirtschaft» اقتصاد، «Jura» قانون. إن كنت تعمل: «Ich arbeite schon.»</p>
<h4>كيف حالك؟</h4>
<div class="tw"><table class="tbl"><thead><tr><th>الجواب</th><th>المعنى</th></tr></thead><tbody>
<tr><td>«Sehr gut, danke.»</td><td>جيد جداً، شكراً</td></tr>
<tr><td>«Danke, gut.»</td><td>بخير، شكراً</td></tr>
<tr><td>«Na ja, es geht.»</td><td>لا بأس</td></tr>
<tr><td>«Nicht so gut.»</td><td>لست بخير</td></tr>
</tbody></table></div>
<p class="note">بعد الجواب أرجع السؤال: «Und Ihnen?» (رسمي) أو «Und dir?» (غير رسمي).</p>`,
 ex:[
  {q:`أكمل: «Ich komme aus ___ Türkei.»`, a:`«der»`},
  {q:`أكمل: «Sie kommt aus ___ USA.»`, a:`«den»`},
  {q:`أكمل: «Er kommt aus ___ Irak.»`, a:`«dem»`},
  {q:`ترجم: أتكلم العربية والفرنسية وقليلاً من الألمانية.`, a:`«Ich spreche Arabisch, Französisch und ein bisschen Deutsch.»`},
  {q:`أجب بأدب عن سؤال «Wie geht es Ihnen?»`, a:`«Danke, gut. Und Ihnen?»`},
  {q:`أكمل بالفعل studieren: «Was ___ du?» – «Ich ___ Wirtschaft.»`, a:`«studierst» ثم «studiere»`}
 ],
 say:[`Ich spreche Arabisch, Französisch und ein bisschen Deutsch.`,`أتكلم العربية والفرنسية وقليلاً من الألمانية.`]
},

 rule:`<h4>1. تصريف الفعل في المضارع</h4>
<p>احذف «-en» من المصدر لتحصل على الجذر: «komm-en» ← «komm». ثم أضف النهاية حسب الضمير:</p>
<div class="tw"><table class="tbl"><thead><tr><th>الضمير</th><th>النهاية</th><th>kommen</th><th>wohnen</th><th>arbeiten</th><th>heißen</th></tr></thead><tbody>
<tr><td>«ich»</td><td>-e</td><td>«komm<b>e</b>»</td><td>«wohn<b>e</b>»</td><td>«arbeit<b>e</b>»</td><td>«heiß<b>e</b>»</td></tr>
<tr><td>«du»</td><td>-st</td><td>«komm<b>st</b>»</td><td>«wohn<b>st</b>»</td><td>«arbeit<b>est</b>»</td><td>«heiß<b>t</b>»</td></tr>
<tr><td>«er/sie/es»</td><td>-t</td><td>«komm<b>t</b>»</td><td>«wohn<b>t</b>»</td><td>«arbeit<b>et</b>»</td><td>«heiß<b>t</b>»</td></tr>
<tr><td>«wir»</td><td>-en</td><td>«komm<b>en</b>»</td><td>«wohn<b>en</b>»</td><td>«arbeit<b>en</b>»</td><td>«heiß<b>en</b>»</td></tr>
<tr><td>«ihr»</td><td>-t</td><td>«komm<b>t</b>»</td><td>«wohn<b>t</b>»</td><td>«arbeit<b>et</b>»</td><td>«heiß<b>t</b>»</td></tr>
<tr><td>«sie/Sie»</td><td>-en</td><td>«komm<b>en</b>»</td><td>«wohn<b>en</b>»</td><td>«arbeit<b>en</b>»</td><td>«heiß<b>en</b>»</td></tr>
</tbody></table></div>
<ul><li>جذر ينتهي بـ t أو d (مثل «arbeit»): نزيد e قبل النهاية: «du arbeitest، er arbeitet».</li><li>جذر ينتهي بـ s أو ß أو z (مثل «heiß»): مع du نضيف t فقط: «du heißt».</li><li>لاحظ: wir وsie/Sie لهما نفس الشكل دائماً، وهو المصدر نفسه.</li></ul>
<h4>2. الفعل «sein» شاذّ، احفظه كما هو</h4>
<p>«ich bin · du bist · er/sie/es ist · wir sind · ihr seid · sie/Sie sind»</p>
<h4>3. مكان الفعل: المرتبة الثانية</h4>
<p>في الجملة الخبرية وفي السؤال الذي يبدأ بـ W (Wie، Wo، Woher) الفعل دائماً في المرتبة 2:</p>
<div class="tw"><table class="tbl"><thead><tr><th>المرتبة 1</th><th>المرتبة 2</th><th>الباقي</th></tr></thead><tbody>
<tr><td>«Ich»</td><td>«<b>wohne</b>»</td><td>«in Tübingen.»</td></tr>
<tr><td>«Wo»</td><td>«<b>wohnst</b>»</td><td>«du?»</td></tr>
<tr><td>«In Tübingen»</td><td>«<b>studiere</b>»</td><td>«ich Medizin.»</td></tr>
</tbody></table></div>
<p>في سؤال نعم/لا يأتي الفعل في المرتبة 1: «<b>Wohnst</b> du in Stuttgart?» – «Nein, ich wohne in Tübingen.»</p>`,
 ex:[
  {q:`أكمل: «Du ___ (arbeiten) in Rabat.»`, a:`«arbeitest»`},
  {q:`أكمل: «Er ___ (heißen) Tarik.»`, a:`«heißt»`},
  {q:`أكمل: «Ihr ___ (sein) neu im Kurs.»`, a:`«seid»`},
  {q:`أكمل: «Ich ___ (lernen) Deutsch. Wir ___ (lernen) zusammen.»`, a:`«lerne» ثم «lernen»`},
  {q:`حوّل إلى سؤال نعم/لا: «Du kommst aus Marokko.»`, a:`«Kommst du aus Marokko?»`},
  {q:`رتّب الكلمات: «wohnst / wo / du / ?»`, a:`«Wo wohnst du?»`}
 ],
 say:[`Wo wohnst du? – Ich wohne in Errachidia.`,`أين تسكن؟ – أسكن في الرشيدية.`]
},

 rule:`<h4>der · das · die</h4>
<p>كل اسم ألماني له جنس: مذكر «[der]»، محايد «[das]»، مؤنث «[die]». والجمع دائماً «die». الجنس لا يُخمَّن في الغالب، لذلك احفظ كل اسم مع أداته وجمعه، كما في قائمة الكتاب ص 14: «[das] Buch, ¨-er» تعني أن الجمع «die Bücher».</p>
<p class="note">نصيحة الكتاب (ص 17): اكتب أسماء الأشياء في بيتك ومكتبك على أوراق صغيرة والصقها عليها، مع الأداة. واستعمل الألوان كما في هذه الصفحة: أزرق للمذكر، أخضر للمحايد، أحمر للمؤنث.</p>
<h4>علامات الجمع</h4>
<div class="tw"><table class="tbl"><thead><tr><th>العلامة</th><th>المفرد</th><th>الجمع</th></tr></thead><tbody>
<tr><td>-e</td><td>«[das] Heft»</td><td>«die Heft<b>e</b>»</td></tr>
<tr><td>¨-e</td><td>«[der] Ball»</td><td>«die B<b>ä</b>ll<b>e</b>»</td></tr>
<tr><td>-n</td><td>«[die] Gruppe»</td><td>«die Gruppe<b>n</b>»</td></tr>
<tr><td>-en</td><td>«[der] Projektor»</td><td>«die Projektor<b>en</b>»</td></tr>
<tr><td>-nen</td><td>«[die] Lehrerin»</td><td>«die Lehrerin<b>nen</b>»</td></tr>
<tr><td>بدون تغيير</td><td>«[der] Kugelschreiber»</td><td>«die Kugelschreiber»</td></tr>
<tr><td>¨</td><td>«[der] Apfel»</td><td>«die <b>Ä</b>pfel»</td></tr>
<tr><td>¨-er</td><td>«[das] Buch»</td><td>«die B<b>ü</b>ch<b>er</b>»</td></tr>
<tr><td>-er</td><td>«[das] Bild»</td><td>«die Bild<b>er</b>»</td></tr>
<tr><td>-s</td><td>«[das] Tablet»</td><td>«die Tablet<b>s</b>»</td></tr>
</tbody></table></div>
<h4>كلمتان صغيرتان في الكلام: «denn» و«ja»</h4>
<p>«Was macht ihr denn hier?» – «denn» في السؤال تعبّر عن الاهتمام والفضول. «Das ist ja super!» – «ja» للتأكيد والتعجب.</p>`,
 ex:[
  {q:`ما أداة «Buch» وما جمعه؟`, a:`«das Buch – die Bücher»`},
  {q:`ما جمع «Lehrerin»؟`, a:`«die Lehrerinnen»`},
  {q:`ما معنى التعليمة «Kreuzen Sie an.»؟`, a:`ضع علامة (✗) على الجواب الصحيح.`},
  {q:`مراجعة الدرس 1 – أكمل: «Woher ___ du?» – «Ich ___ aus Marokko.»`, a:`«kommst» ثم «komme»`},
  {q:`مراجعة – قدّم زميلاً بالشخص الثالث: اسمه Tarik، من المغرب، يدرس المعلوميات.`, a:`«Das ist Tarik. Er kommt aus Marokko. Er studiert Informatik.»`},
  {q:`مراجعة – تشير إلى قلم ولا تعرف اسمه. ماذا تسأل؟`, a:`«Wie heißt das auf Deutsch?» والجواب: «Das heißt …» أو «Das weiß ich nicht.»`}
 ],
 say:[`Wie heißt das auf Deutsch? – Das heißt „der Kugelschreiber“.`,`ماذا يُسمّى هذا بالألمانية؟ – يُسمّى «قلم الحبر».`]
},

 rule:`<h4>الفاعل أم المفعول به؟</h4>
<p>السؤال «Wer / Was» (من؟ ماذا؟) عن الفاعل = <b class="end">Nominativ</b>. السؤال «Wen / Was» عن المفعول به = <b class="end">Akkusativ</b>.</p>
<p>«Ich habe einen Computer. Ich brauche den Computer für die Arbeit. Der Computer ist sehr praktisch.»</p>
<p>التغيير يحدث <b class="end">في المذكر فقط</b>: der ← den، ein ← einen، kein ← keinen. المحايد والمؤنث والجمع لا تتغير.</p>
<div class="tw"><table class="tbl"><thead><tr><th></th><th>مذكر</th><th>محايد</th><th>مؤنث</th><th>جمع</th></tr></thead><tbody>
<tr><td>فاعل</td><td>«der / ein / kein Computer»</td><td>«das / ein / kein Telefon»</td><td>«die / eine / keine Kamera»</td><td>«die / – / keine Kassetten»</td></tr>
<tr><td>مفعول به</td><td>«<b>den / einen / keinen</b> Computer»</td><td>«das / ein / kein Telefon»</td><td>«die / eine / keine Kamera»</td><td>«die / – / keine Kassetten»</td></tr>
</tbody></table></div>
<p>أفعال تأخذ مفعولاً به: «haben، brauchen، benutzen، kaufen، nehmen، es gibt».</p>
<h4>الفعل «haben»</h4>

<p class="note">الصعوبة للعربي: الأداة تتبع <b>صاحب الشيء</b> (هو أم هي) ثم جنس <b>الشيء نفسه</b>. «Jan hat eine Schwester. <b>Seine</b> Schwester heißt Karolin.» و«Oma Gisela hat einen Freund. <b>Ihr</b> Freund heißt Bernhard.»</p>
<h4>أدوات الربط «und، oder، aber»</h4>
<p>«und» (و)، «oder» (أو)، «aber» (لكن) تأخذ المرتبة 0، أي لا تغيّر ترتيب الجملة بعدها:</p>

 rule:`<h4>متى؟ am + اليوم، um + الساعة</h4>
<p>كل أيام الأسبوع مذكرة: «[der] Montag». «Wir gehen <b>am</b> Donnerstag <b>um</b> 19 Uhr essen.»</p>
<h4>الفاعل في المرتبة 1 أو بعد الفعل مباشرة</h4>
<p>«Das Topkapı ist am Montag geschlossen.» = «Am Montag ist das Topkapı geschlossen.» المعنى واحد، والفعل يبقى دائماً في المرتبة 2. الكتاب ينصحك بالتنويع بين الطريقتين في كتابتك.</p>
<h4>أفعال يتغير حرفها: nehmen و essen</h4>
<p>«ich nehme، du <b>nimmst</b>، er <b>nimmt</b>» – «ich esse، du <b>isst</b>، er <b>isst</b>». الجمع عادي: «wir nehmen، wir essen».</p>
<h4>«möchte» للطلب بأدب</h4>
<ul><li>مع اسم: «Ich möchte ein Bier.»</li><li>مع فعل، والفعل يذهب إلى آخر الجملة: «Wir möchten bezahlen.»</li></ul>
<div class="tw"><table class="tbl"><thead><tr><th>الزبون</th><th>النادل</th></tr></thead><tbody>
<tr><td>«Wir möchten gerne bestellen.»</td><td>«Ja gern. Was bekommen Sie?»</td></tr>
<tr><td>«Ich nehme einen Salat und ein Wasser.»</td><td>«Und was möchten Sie trinken?»</td></tr>
<tr><td>«Wir möchten bitte zahlen.»</td><td>«Zusammen oder getrennt?»</td></tr>
<tr><td>«Getrennt, bitte.»</td><td>«Das macht 14,90 Euro.»</td></tr>
</tbody></table></div>`,
 ex:[
  {q:`أكمل: «___ Freitag ___ 20 Uhr.»`, a:`«Am» ثم «um»`},
  {q:`ابدأ الجملة بـ «Am Sonntag»: «Das Restaurant ist am Sonntag geöffnet.»`, a:`«Am Sonntag ist das Restaurant geöffnet.»`},
  {q:`أكمل: «Du ___ (nehmen) ein Schnitzel.»`, a:`«nimmst»`},

 ],
 say:[`Ich möchte bitte bestellen. Ich nehme eine Suppe und ein Wasser.`,`أودّ أن أطلب من فضلك. سآخذ حساءً وماءً.`]
},

 rule:`<h4>Wie viel أم Wie viele؟</h4>
<ul><li>«Wie viel» للكمية التي لا تُعدّ: «Wie viel Hackfleisch möchten Sie?» – «250 Gramm.»</li><li>«Wie viele» للأشياء المعدودة: «Wie viele Würstchen nehmen Sie?» – «3 Würstchen.»</li></ul>
<h4>الكمية + الاسم مباشرة</h4>
<p>لا توجد «من» بين الكمية والاسم كما في العربية والفرنسية (un kilo <i>de</i> pommes): «eine Flasche Wasser»، «ein Kilo Äpfel»، «500 Gramm Käse». وللكمية غير المحددة بدون أداة: «Ich kaufe Wasser und Milch.»</p>

<tr><td>«Darf es sonst noch etwas sein?»</td><td>«Nein, danke. Das ist alles.»</td></tr>
<tr><td>«Das macht 12,99 Euro.»</td><td>«Vielen Dank. Auf Wiedersehen.»</td></tr>
</tbody></table></div>
<p class="note">الثمن يُكتب «1,30 €» ويُقرأ «ein Euro dreißig».</p>`,

 rule:`<h4>المهن: المذكر والمؤنث</h4>

<h4>«denn» = لأنّ</h4>
<p>«denn» تربط جملتين كاملتين، وتأخذ المرتبة 0 مثل und وaber، أي أن الجملة الثانية تبقى بترتيبها العادي. وقبلها <b class="end">فاصلة دائماً</b>.</p>

<p>«Das Meeting ist am Montag, 17. April, am Vormittag um 10 Uhr.» الشهور والفصول وأوقات اليوم كلها مذكرة، والاستثناء «die Nacht».</p>
<h4>الأعداد الترتيبية والتاريخ</h4>
<ul><li>من 1 إلى 19 نضيف «-te»: «der zweite، der vierte». الشاذة: «der erste»، «der dritte»، «der siebte».</li><li>من 20 فما فوق نضيف «-ste»: «der zwanzigste، der fünfundzwanzigste».</li><li>في التاريخ مع am تصبح النهاية «-ten»: «am 2.8.» = «am zweiten Achten» أو «am zweiten August».</li><li>من … إلى: «vom 10. bis zum 21. Juni» = «vom zehnten bis zum einundzwanzigsten Juni».</li></ul>
<h4>الرسالة الرسمية (ص 38)</h4>
<p>البداية: «Sehr geehrte Frau Danner,» أو «Sehr geehrter Herr …,» ثم يبدأ النص في السطر التالي بحرف صغير. النهاية: «Mit freundlichen Grüßen» ثم الاسم.</p>`,

<div class="tw"><table class="tbl"><thead><tr><th>التغيير</th><th>المصدر</th><th>du</th><th>er/sie/es</th></tr></thead><tbody>
<tr><td>e ← ie</td><td>«lesen»</td><td>«l<b>ie</b>st»</td><td>«l<b>ie</b>st»</td></tr>

<p>«wissen» يتغير حتى مع ich: «ich weiß، du weißt، er weiß، wir wissen، ihr wisst، sie wissen».</p>
<p class="note">ich وwir وihr وsie تبقى عادية: «ich lese، wir lesen، ihr lest». تعرّفت سابقاً على «nehmen ← nimmst» و«essen ← isst»، وهي من نفس العائلة.</p>
<h4>gern · lieber · nicht gern</h4>
<p>«gern» تأتي بعد الفعل: «Ich spiele gern Fußball.» (أحب لعب الكرة). «Ich lese lieber.» (أفضّل القراءة). «Ich tanze nicht gern.» (لا أحب الرقص).</p>
<p>الأجوبة: «Ja, sehr gern.» – «Nein, nicht so gern.» – «Nein, überhaupt nicht gern.» – «Nein, ich laufe lieber.»</p>`,

 rule:`<h4>البادئة تذهب إلى آخر الجملة</h4>
<p>في أفعال مثل «<b>auf</b>stehen» و«<b>an</b>fangen» تنفصل البادئة (an، auf، aus، mit، statt، fern، ein) وتذهب إلى آخر الجملة، مثل القوس الذي رأيته مع müssen:</p>
<div class="tw"><table class="tbl"><thead><tr><th>المصدر</th><th>م1</th><th>م2</th><th>الوسط</th><th>آخر الجملة</th></tr></thead><tbody>
<tr><td>«anfangen»</td><td>«Wann»</td><td>«<b>fängt</b>»</td><td>«das Training»</td><td>«<b>an</b>?»</td></tr>
<tr><td>«aufstehen»</td><td>«Ich»</td><td>«<b>stehe</b>»</td><td>«um 7 Uhr»</td><td>«<b>auf</b>.»</td></tr>
<tr><td>«anrufen»</td><td>«Ich»</td><td>«<b>rufe</b>»</td><td>«dich später»</td><td>«<b>an</b>.»</td></tr>
<tr><td>«stattfinden»</td><td>«Das Training»</td><td>«<b>findet</b>»</td><td>«jeden Mittwoch»</td><td>«<b>statt</b>.»</td></tr>
</tbody></table></div>
<h4>مع فعل الصيغة: لا انفصال</h4>
<p>إذا كان في الجملة müssen أو können أو möchten، يبقى الفعل المنفصل كاملاً في آخر الجملة: «Ich möchte beim Lauftraining <b>mitmachen</b>.» «Tim kann uns im Auto <b>mitnehmen</b>.»</p>
<p class="note">النبرة دائماً على البادئة: <b>ÁN</b>fangen، <b>ÁUF</b>stehen، <b>MÍT</b>kommen.</p>`,

 rule:`<h4>Perfekt = haben / sein + اسم المفعول في آخر الجملة</h4>
<div class="tw"><table class="tbl"><thead><tr><th>م1</th><th>م2</th><th>الوسط</th><th>آخر الجملة</th></tr></thead><tbody>
<tr><td>«Ich»</td><td>«<b>habe</b>»</td><td>«die 10 Kilometer in 39 Minuten»</td><td>«<b>geschafft</b>.»</td></tr>
<tr><td>«Für die 10 km»</td><td>«<b>habe</b>»</td><td>«ich dieses Jahr nicht intensiv»</td><td>«<b>trainiert</b>.»</td></tr>
<tr><td>«Beate Langer»</td><td>«<b>ist</b>»</td><td>«schon beim Ironman»</td><td>«<b>gestartet</b>.»</td></tr>
</tbody></table></div>
<h4>كيف نصنع اسم المفعول (Partizip)؟</h4>
<ul><li>القاعدة: <b class="end">ge + الجذر + t</b>: «machen ← gemacht»، «spielen ← gespielt»، «schaffen ← geschafft».</li><li>جذر ينتهي بـ t أو d: <b class="end">ge + الجذر + et</b>: «starten ← gestartet»، «arbeiten ← gearbeitet».</li><li>أفعال تنتهي بـ «-ieren»: بدون ge: «trainieren ← trainiert»، «passieren ← passiert».</li></ul>
<h4>haben أم sein؟</h4>
<p><b class="end">sein</b> مع الأفعال التي فيها تغيير مكان أو حالة: «Ich bin gestartet.» «Er ist gestürzt.» «Was ist passiert?» و<b class="end">haben</b> مع كل الأفعال الأخرى، وهي الأغلبية.</p>
<p class="note">مع haben وsein نفسيهما نستعمل في الكلام الماضي البسيط: «Ich hatte …» و«Es war …» بدل Perfekt.</p>`,
 ex:[
  {q:`اسم المفعول من «machen»؟`, a:`«gemacht»`},

 ],

const LKEY = 'dafk-app-v2';
function blank(){ return {v:2, done:{}, log:{}, cards:{}, pos:{}, set:{slow:false, auto:true, dir:'de'}, u:0}; }
function clean(o){ const b=blank(); if(!o||typeof o!=='object') return b; ['done','log','cards','pos','set'].forEach(k=>{ if(o[k]&&typeof o[k]==='object') b[k]=Object.assign(b[k],o[k]); }); b.u=+o.u||0; return b; }
let S = blank();
try{ const raw=localStorage.getItem(LKEY); if(raw) S=clean(JSON.parse(raw)); }catch(e){}
try{ const old=localStorage.getItem('dafk-done'); if(old && !Object.keys(S.done).length){ JSON.parse(old).forEach(n=>{ S.done[n]={d:today(),s:0,t:0,m:0}; }); } }catch(e){}
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
function merge(a,b){
  const newer=(a.u||0)>=(b.u||0)?a:b, older=newer===a?b:a, r=blank();
  r.set=Object.assign(r.set, older.set, newer.set);
  r.done=Object.assign({}, older.done, newer.done);
  r.pos=Object.assign({}, older.pos, newer.pos);
  [a.log,b.log].forEach(L=>Object.keys(L||{}).forEach(d=>{ r.log[d]=Math.max(r.log[d]||0, +L[d]||0); }));
  r.cards=Object.assign({}, a.cards);
  Object.keys(b.cards||{}).forEach(id=>{ const x=r.cards[id], y=b.cards[id]; if(!x || (y.t||0)>(x.t||0)) r.cards[id]=y; });
  r.u=Math.max(a.u||0,b.u||0);
  return r;
}

/* ---------------- sync (db capability, private per person) ---------------- */
const SYNC = {ref:null, on:false, busy:false, again:false, timer:0, lastPull:0};
function syncLabel(){ const d=$('#syncDot'); if(d && !IN_CLAUDE){ d.hidden=true; } if(d){ d.classList.toggle('on',SYNC.on); d.title = SYNC.on ? 'التقدم محفوظ في حسابك' : 'التقدم محفوظ على هذا الجهاز'; } const s=$('#syncText'); if(s) s.textContent = !IN_CLAUDE ? 'تقدّمك محفوظ في هذا المتصفح على هذا الجهاز. لنقله إلى جهاز آخر استعمل النسخة الاحتياطية أسفله.' : SYNC.on ? 'تقدّمك محفوظ في حسابك، ويظهر لك على الهاتف والحاسوب.' : 'تقدّمك محفوظ على هذا الجهاز فقط الآن. سيُحفظ في حسابك تلقائياً عند توفر الاتصال.'; }
async function initSync(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const pair = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    const user=pair[0], db=pair[1];
    if(!user || !db) return;
    const uid = await user.id();
    if(!uid) return;
    SYNC.ref = db.doc('data/users/'+uid+'/progress');
    await pull();
  }catch(e){}
}
async function pull(){
  if(!SYNC.ref) return;
  SYNC.lastPull=Date.now();
  try{
    const snap = await SYNC.ref.get();
    let remote=null;
    if(snap.exists){ try{ remote=clean(JSON.parse(snap.data().json)); }catch(e){} }
    SYNC.on=true;
    if(remote){
      const before=JSON.stringify(S);
      S=merge(S,remote); saveLocal();
      if(JSON.stringify(S)!==before){ render(); }
      if(JSON.stringify(S)!==JSON.stringify(remote)) scheduleWrite();
    } else if(Object.keys(S.done).length || Object.keys(S.cards).length){ scheduleWrite(); }
  }catch(e){ SYNC.on=false; }
  syncLabel();
}
function scheduleWrite(){ if(!SYNC.ref) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(flush,1200); }
async function flush(){
  if(!SYNC.ref) return;
  clearTimeout(SYNC.timer); SYNC.timer=0;
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true;
  try{ await SYNC.ref.set({json:JSON.stringify(S), u:S.u}); SYNC.on=true; }
  catch(e){ if(e && e.code==='unavailable'){ setTimeout(scheduleWrite, 1200+Math.random()*1800); } else if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){ SYNC.ref=null; SYNC.on=false; } }
  SYNC.busy=false; syncLabel();
  if(SYNC.again){ SYNC.again=false; flush(); }
}
function commit(){ S.u=Date.now(); saveLocal(); scheduleWrite(); }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(SYNC.timer) flush(); }
  else if(SYNC.ref && Date.now()-SYNC.lastPull>30000){ pull(); }
});

/* ---------------- audio: neural German voice sprites, browser voice as fallback ---------------- */
const AUDIO = (function(){
  let ctx=null, src=null, token=0, markEl=null, warned=false;
  const raw={}, bufs={};
  const file=(d,slow)=>'audio/d'+pad2(d)+(slow?'s':'')+'.mp3';
  function prefetch(d,slow){ const id=d+(slow?'s':''); if(!raw[id]) raw[id]=fetch(file(d,slow)).then(r=>{ if(!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); }).catch(()=>{ delete raw[id]; return null; }); return raw[id]; }
  function ensure(){
    if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C){ try{ ctx=new C(); }catch(e){ ctx=null; } } }
    if(ctx && ctx.state!=='running'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function buffer(d,slow){
    const id=d+(slow?'s':'');
    if(!bufs[id]) bufs[id]=prefetch(d,slow).then(ab=>{
      if(!ab||!ctx) return null;
      return new Promise(res=>{ let p; try{ p=ctx.decodeAudioData(ab.slice(0), b=>res(b), ()=>res(null)); }catch(e){ res(null); } if(p&&p.then) p.then(res,()=>res(null)); });
    }).then(b=>{ if(!b) delete bufs[id]; return b; });
    return bufs[id];
  }
  function locate(d,k){ const D=M&&M.days; if(!D) return null; if(D[d]&&D[d][k]) return [d,D[d][k]]; for(const x in D){ if(D[x][k]) return [+x,D[x][k]]; } return null; }
  function mark(el){ if(markEl) markEl.classList.remove('is-playing'); markEl=el||null; if(markEl) markEl.classList.add('is-playing'); }
  function stop(){
    token++;
    if(src){ const n=src; src=null; n.onended=null; try{ n.stop(); }catch(e){} if(n._res) n._res(); }
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    mark(null);
  }
  function fallback(k,slow,my){
    if(!warned){ warned=true; toast('ملفات الصوت لم تُحمَّل بعد، يُستعمل صوت المتصفح مؤقتاً.'); }
    return new Promise(res=>{
      if(!('speechSynthesis' in window)){ mark(null); res(); return; }
      try{
        const u=new SpeechSynthesisUtterance(k); u.lang='de-DE'; u.rate=slow?0.6:0.9;
        const v=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang)); if(v) u.voice=v;
        u.onend=u.onerror=()=>{ if(my===token) mark(null); res(); };
        speechSynthesis.speak(u);
      }catch(e){ mark(null); res(); }
    });
  }
  async function play(d,k,opt){
    opt=opt||{}; const slow=!!opt.slow;
    stop(); const my=token; mark(opt.el);
    const c=ensure(); const loc=locate(d,k);
    if(!loc||!c) return fallback(k,slow,my);
    if(opt.el) opt.el.classList.add('is-loading');
    const b=await buffer(loc[0],slow);
    if(opt.el) opt.el.classList.remove('is-loading');
    if(my!==token) return;
    if(!b) return fallback(k,slow,my);
    const clip=loc[1], st=(slow?clip[2]:clip[0])/1000, du=(slow?clip[3]:clip[1])/1000;
    return new Promise(res=>{
      const n=c.createBufferSource(); n.buffer=b; n.connect(c.destination); n._res=res;
      n.onended=()=>{ if(src===n){ src=null; mark(null); } res(); };
      src=n;
      try{ n.start(0, Math.max(0,st-0.03), du+0.1); }catch(e){ src=null; mark(null); res(); }
    });
  }
  return {play, stop, prefetch, current:()=>token};
})();

function gradeCard(r){
  const id=CS.q[CS.i], c=Object.assign({b:0}, S.cards[id]), t=today();
  if(r==='ok'){ c.b=Math.min(5,(c.b||0)+1); c.due=addDays(t,INTV[c.b]); }
  else if(r==='hard'){ c.b=Math.max(1,c.b||0); c.due=addDays(t,1); }
  else { c.b=0; c.due=t; if(!CS.again[id]){ CS.again[id]=1; CS.q.push(id); } }
  c.t=Date.now(); S.cards[id]=c; CS.st[r]++; commit();
  CS.i++; CS.flip=false;
  if(CS.i>=CS.q.length){ CS.end=true; AUDIO.stop(); }
  render();
}
function autoPlayCard(){
  if(!CS||CS.end||!S.set.auto) return;
  const c=cardOf(CS.q[CS.i]);
  if(S.set.dir==='de' ? !CS.flip : CS.flip){ const el=$('.flash .pbtn'); AUDIO.play(c.n, keyOf(c.v[0]), {el, slow:S.set.slow}); }
}

/* ---------------- listening mode ---------------- */
const LS={day:curDay(), mode:'vocab', i:0, playing:false, run:0, rep:true, gap:3};
function listenItems(){
  const d=DAYS[LS.day-1];
  if(LS.mode==='vocab') return d.vocab.map(v=>({k:keyOf(v[0]), de:v[0], pr:v[1], ar:v[2]}));
  const seen=new Set(), out=[];
  const add=(k,ar)=>{ if(!k||seen.has(k)) return; seen.add(k); out.push({k, de:k, ar:ar||''}); };
  add(keyOf(d.say[0]), d.say[1]);
  d.ex.forEach(e=>{ const c=CORE.complete(e); if(c) add(keyOf(c)); CORE.spans(e.a).filter(k=>CORE.playable(k) && /[.?!]$/.test(k) && k.split(' ').length>=3).forEach(k=>add(k)); });
  return out;
}
function listenView(){
  const items=listenItems(), it=items[Math.min(LS.i,items.length-1)];
  let days=''; for(let n=1;n<=NDAYS;n++) days+='<button type="button" class="'+(n===LS.day?'on':'')+'" data-act="ls-day" data-n="'+n+'" aria-label="اليوم '+n+'">'+n+'</button>';
  return '<header class="scr-h"><h1>الاستماع</h1><p>اسمع كل كلمة ثم ردّدها بصوت عالٍ في المهلة التي تليها. يناسب الطريق وأوقات الانتظار.</p></header>'+
    '<div class="ls-days" id="lsDays">'+days+'</div>'+
    '<div class="row" style="justify-content:space-between"><div class="seg"><button type="button" class="'+(LS.mode==='vocab'?'on':'')+'" data-act="ls-mode" data-m="vocab">المفردات</button><button type="button" class="'+(LS.mode==='sent'?'on':'')+'" data-act="ls-mode" data-m="sent">الجمل</button></div><span class="muted" style="font-size:13px">Tag '+LS.day+' · '+esc(DAYS[LS.day-1].title)+'</span></div>'+
    '<div class="ls-now" id="lsNow" data-day="'+LS.day+'">'+nowHTML(it,items.length)+'</div>'+
    '<div class="ls-ctrl"><button type="button" class="ls-skip" data-act="ls-prev" aria-label="السابق">'+ICON.skipB+'</button><button type="button" class="ls-play" data-act="ls-toggle" id="lsPlay" aria-label="'+(LS.playing?'إيقاف':'تشغيل')+'">'+(LS.playing?ICON.pause:ICON.play)+'</button><button type="button" class="ls-skip" data-act="ls-next" aria-label="التالي">'+ICON.skipF+'</button></div>'+
    '<div class="ls-opts"><button type="button" class="chip-btn '+(LS.rep?'on':'')+'" data-act="ls-rep">'+ICON.repeat+'أعد كل كلمة ببطء</button><button type="button" class="chip-btn" data-act="ls-gap">مهلة الترديد: '+LS.gap+' ث</button></div>'+
    '<ol class="ls-list" id="lsList" data-day="'+LS.day+'">'+items.map((x,i)=>'<li><button type="button" class="'+(i===LS.i?'cur':'')+'" data-act="ls-jump" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="t">'+deOf(x.de).replace(' tap"','"').replace(/ data-k="[^"]*" role="button" tabindex="0"/,'')+(x.ar?'<small>'+x.ar+'</small>':'')+'</span></button></li>').join('')+'</ol>';
}
function nowHTML(it,len){
  if(!it) return '<span class="hint">لا توجد عناصر</span>';
  return '<span class="cnt">'+(LS.i+1)+' / '+len+'</span>'+deOf(it.de).replace(' tap"','"')+(it.pr?'<span class="pr">'+it.pr+'</span>':'')+(it.ar?'<span class="ar">'+it.ar+'</span>':'');
}
function listenSync(scroll){
  const items=listenItems(); const now=$('#lsNow'); if(!now) return;
  now.innerHTML=nowHTML(items[LS.i],items.length);
  $$('#lsList button').forEach((b,i)=>b.classList.toggle('cur',i===LS.i));
  const p=$('#lsPlay'); if(p){ p.innerHTML=LS.playing?ICON.pause:ICON.play; p.setAttribute('aria-label',LS.playing?'إيقاف':'تشغيل'); }
  if(scroll){ const c=$('#lsList .cur'); if(c && c.scrollIntoView) c.scrollIntoView({block:'nearest', behavior:reduceMotion()?'auto':'smooth'}); }
}
let wake=null;
async function listenLoop(){
  const my=++LS.run; LS.playing=true; listenSync(false);
  try{ if(navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(w=>{ wake=w; }).catch(()=>{}); }catch(e){}
  const alive=()=>LS.playing && my===LS.run;
  let items=listenItems();
  while(alive() && LS.i<items.length){
    listenSync(true);
    const k=items[LS.i].k;
    await AUDIO.play(LS.day, k, {el:$('#lsNow .de')}); if(!alive()) break;
    await sleep(LS.gap*1000); if(!alive()) break;
    if(LS.rep){ await AUDIO.play(LS.day, k, {slow:true, el:$('#lsNow .de')}); if(!alive()) break; await sleep(LS.gap*1000); if(!alive()) break; }
    LS.i++;
  }
  if(my===LS.run){ LS.playing=false; if(LS.i>=items.length) LS.i=0; listenSync(false); releaseWake(); }
}
function releaseWake(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
function listenStop(){ LS.playing=false; LS.run++; AUDIO.stop(); releaseWake(); listenSync(false); }

/* ---------------- lesson player ---------------- */
let L=null, plTimer=0;
function openLesson(n, step){
  listenStop(); AUDIO.stop();
  L={n, step: step!=null?step:Math.min(S.pos[n]||0,4), ex:{}, open:{}, reps:0, hide:false, elapsed:0, last:Date.now(), finished:false, peek:{}, shown:{}};
  AUDIO.prefetch(n,false);
  const pl=$('#player'); pl.hidden=false; document.body.style.overflow='hidden';
  renderPlayer(true);
  clearInterval(plTimer); plTimer=setInterval(tickTimer,1000);
}
function closeLesson(){
  if(!L) return;
  AUDIO.stop(); vocabStop();
  if(!L.finished){ S.pos[L.n]=L.step; commit(); }
  L=null; clearInterval(plTimer);
  $('#player').hidden=true; $('#player').innerHTML=''; document.body.style.overflow='';
  render();
}
function tickTimer(){
  if(!L) return;
  const now=Date.now(); if(document.visibilityState==='visible' && !L.finished) L.elapsed+= (now-L.last)/1000; L.last=now;
  const t=$('#plTimer b'); if(t){ const s=Math.floor(L.elapsed); t.textContent=pad2(Math.floor(s/60))+':'+pad2(s%60); }
}
function renderPlayer(full){
  const n=L.n, d=DAYS[n-1], pl=$('#player');
  const s=Math.floor(L.elapsed);
  if(full){
    pl.innerHTML='<div class="pl-head"><div class="pl-head-in"><button type="button" class="icon-btn" data-act="pl-close" aria-label="إغلاق الدرس">'+ICON.close+'</button><div class="pl-title"><small>Tag '+n+' · '+esc(d.ref)+'</small><b>'+d.title+'</b></div><span class="pl-timer" id="plTimer" title="وقت الدراسة">'+ICON.timer+'<b>'+pad2(Math.floor(s/60))+':'+pad2(s%60)+'</b></span></div><div class="pl-steps" id="plSteps"></div></div>'+
      '<div class="pl-body" id="plBody"><div class="pl-body-in" id="plIn" data-day="'+n+'"></div></div><div class="pl-foot"><div class="pl-foot-in" id="plFoot"></div></div>';
  }
  $('#plSteps').innerHTML = L.finished ? SEGS.map(x=>'<div class="pl-step past"><i></i><span>'+x[0]+'</span></div>').join('') :
    SEGS.map((x,i)=>'<button type="button" class="pl-step'+(i===L.step?' cur':'')+(i<L.step?' past':'')+'" data-act="pl-step" data-i="'+i+'"><i></i><span>'+x[0]+'</span></button>').join('');
  const body = L.finished ? finishView() : [stepReview,stepVocab,stepRule,stepEx,stepSay][L.step]();
  const pin=$('#plIn'); pin.innerHTML=body; pin.classList.remove('enter'); void pin.offsetWidth; pin.classList.add('enter');
  fillGrids(pin);
  $('#plFoot').innerHTML = L.finished
    ? '<button type="button" class="btn btn-ghost" data-act="pl-cards">راجع كلمات اليوم</button><button type="button" class="btn btn-primary" data-act="pl-close">العودة للرئيسية</button>'
    : '<button type="button" class="btn btn-ghost" data-act="pl-prev"'+(L.step===0?' disabled':'')+'>'+ICON.prev+'السابق</button>'+
      (L.step<4 ? '<button type="button" class="btn btn-primary" data-act="pl-next">التالي'+ICON.next+'</button>' : '<button type="button" class="btn btn-ok" data-act="pl-finish">'+ICON.check+'إنهاء اليوم</button>');
}
function rerenderBody(){ const b=$('#plBody'), y=b?b.scrollTop:0; renderPlayer(false); if(b) b.scrollTop=y; $('#plIn').classList.remove('enter'); }
function goStep(i){ vocabStop(); AUDIO.stop(); L.step=Math.max(0,Math.min(4,i)); S.pos[L.n]=L.step; commit(); renderPlayer(false); $('#plBody').scrollTop=0; }
const stepHead=(i,extra)=>'<div class="step-h"><h3>'+SEGS[i][0]+'</h3>'+(extra||'<span class="min">'+SEGS[i][1]+' دقيقة</span>')+'</div>';
function recallPick(n){ const v=DAYS[n-1].vocab, out=[], step=v.length/5; for(let j=0;j<5;j++) out.push(v[Math.floor(j*step+step/2)]); return out; }
function stepReview(){

       recallPick(n-1).map((v,j)=>'<li><button type="button" class="'+(L.shown[j]?'shown':'')+'" data-act="recall" data-j="'+j+'" data-rk="'+esc(keyOf(v[0]))+'"><span class="q">'+v[2]+'</span><span class="a">'+esc(keyOf(v[0]))+'</span></button></li>').join('')+'</ul></div>';

function stepVocab(){

    '<div class="tools"><button type="button" class="chip-btn'+(VS.on?' on':'')+'" data-act="vocab-all">'+(VS.on?ICON.pause+'إيقاف':ICON.play+'استمع للكل')+'</button><button type="button" class="chip-btn'+(L.hide?' on':'')+'" data-act="vocab-hide">'+ICON.eye+'إخفاء الألمانية</button></div>'+

function stepRule(){ return stepHead(2)+'<p class="hint">اضغط على أي عبارة ألمانية منقّطة لتسمع نطقها.</p><div class="rule">'+fmt(DAYS[L.n-1].rule)+'</div>'; }
function exScore(){ const d=DAYS[L.n-1]; let ok=0; d.ex.forEach((e,i)=>{ if(L.ex[i]==='ok') ok++; }); return [ok,d.ex.length]; }
function stepEx(){

function stepSay(){
  const d=DAYS[L.n-1], k=keyOf(d.say[0]), C=2*Math.PI*42, f=Math.min(L.reps,10)/10;

function finishLesson(){

  renderPlayer(false); $('#plBody').scrollTop=0;
  setTimeout(()=>{ if(L && L.finished) AUDIO.play(0,'Sehr gut! Weiter so!',{el:$('.finish .de')}); }, 450);
}

/* vocab sequence inside lesson */
const VS={on:false, run:0};
async function vocabAll(){
  const my=++VS.run; VS.on=true; rerenderBody();
  const d=DAYS[L.n-1], n=L.n;
  for(let i=0;i<d.vocab.length;i++){
    if(!VS.on||my!==VS.run||!L||L.n!==n) break;
    const row=$('#vlist .vrow[data-i="'+i+'"]'); $$('#vlist .vrow.seq').forEach(r=>r.classList.remove('seq'));
    if(row){ row.classList.add('seq'); if(row.scrollIntoView) row.scrollIntoView({block:'nearest', behavior:reduceMotion()?'auto':'smooth'}); }
    await AUDIO.play(n, keyOf(d.vocab[i][0]), {el: row?row.querySelector('.pbtn'):null, slow:S.set.slow});
    if(!VS.on||my!==VS.run) break;
    await sleep(1600);
  }
  if(my===VS.run){ VS.on=false; $$('#vlist .vrow.seq').forEach(r=>r.classList.remove('seq')); if(L && !L.finished && L.step===1) rerenderBody(); }
}
function vocabStop(){ if(VS.on){ VS.on=false; VS.run++; } }

}

/* ---------------- install, offline audio, backup ---------------- */
let installEvt=null;
const standalone = ()=> (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
function showInstall(){ const b=$('#installBtn'); if(b) b.hidden=!installEvt; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; showInstall(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; showInstall(); toast('ثُبّت التطبيق. ستجده في شاشتك الرئيسية.'); });
const AUDIO_FILES = (M && M.days ? Object.keys(M.days) : []).reduce((a,d)=>a.concat(['d'+pad2(d)+'.mp3','d'+pad2(d)+'s.mp3']),[]);
const AUDIO_CACHE='dafk-audio-v1';
async function offlineCheck(){
  const t=$('#offText'), b=$('#dlBtn'); if(!t||!b||!('caches' in window)) return;
  try{ const c=await caches.open(AUDIO_CACHE); let n=0; for(const f of AUDIO_FILES){ if(await c.match(new URL('audio/'+f,location.href).href)) n++; }
    if(n>=AUDIO_FILES.length){ t.textContent='كل الأصوات محفوظة على جهازك. التطبيق يعمل بدون إنترنت.'; b.hidden=true; }
    else if(n>0){ t.textContent='محفوظ '+n+' من '+AUDIO_FILES.length+' ملف صوتي. نزّل الباقي ليعمل كل شيء بدون إنترنت.'; }
  }catch(e){}
}
async function downloadAll(b){
  if(!('caches' in window)) return;
  b.disabled=true;
  try{
    const c=await caches.open(AUDIO_CACHE); let i=0;
    for(const f of AUDIO_FILES){ i++; b.textContent='جارٍ التنزيل '+i+' / '+AUDIO_FILES.length; const u=new URL('audio/'+f,location.href).href; if(!(await c.match(u))) await c.add(u); }
    toast('نُزّلت كل الأصوات. التطبيق يعمل الآن بدون إنترنت.');
  }catch(e){ b.textContent='تعذّر التنزيل. تحقّق من الاتصال ثم أعد المحاولة.'; b.disabled=false; return; }
  b.disabled=false; offlineCheck();
}
function backupCode(){ return 'DAFK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function restoreCode(code){
  const m=/DAFK1:([A-Za-z0-9+/=\s]+)/.exec(code||''); if(!m) return false;
  try{ const o=clean(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s+/g,'')))))); S=merge(S,o); S.u=Date.now(); saveLocal(); scheduleWrite(); return true; }catch(e){ return false; }
}

/* ---------------- settings sheet ---------------- */
let armT=0;
function openSettings(){
  const sh=$('#sheet');
  sh.innerHTML='<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="الإعدادات"><span class="sheet-grip"></span><div class="row" style="justify-content:space-between"><h2>الإعدادات</h2><button type="button" class="icon-btn" data-act="sheet-close" aria-label="إغلاق">'+ICON.close+'</button></div>'+
    '<label class="sw" for="setSlow"><span>النطق البطيء دائماً<br><small class="muted">لكل أزرار الاستماع في الدروس</small></span><input type="checkbox" id="setSlow"'+(S.set.slow?' checked':'')+'></label>'+
    '<label class="sw" for="setAuto"><span>تشغيل النطق تلقائياً في البطاقات</span><input type="checkbox" id="setAuto"'+(S.set.auto?' checked':'')+'></label>'+
    '<div class="sync-box">'+ICON.cloud+'<span id="syncText"></span></div>'+
    '<h3>دليل النطق والألوان</h3><ul class="guide">'+
      '<li><b>ڭ</b> = G · <b>ڤ</b> = W · <b>پ</b> = P · حرف <span class="de">v</span> يُنطق ف غالباً</li>'+
      '<li><span class="de">ch</span> بعد i وe = ش خفيفة (<span class="de">ich</span>)، وبعد a وo وu = خ (<span class="de">Buch</span>)</li>'+
      '<li><span class="de">ü</span> = u الفرنسية (tu) · <span class="de">ö</span> = eu الفرنسية (deux) · <span class="de">u</span> = ou · <span class="de">e</span> = é</li>'+
      '<li><span class="de">ei</span> = آي · <span class="de">ie</span> = إي طويلة · <span class="de">eu</span> = أوي · <span class="de">z</span> = تس · <span class="de">ß</span> = س</li></ul>'+
    '<div class="legend"><span><span class="g g-der">der</span> مذكر</span><span><span class="g g-das">das</span> محايد</span><span><span class="g g-die">die</span> مؤنث</span><span>die بدون لون = جمع</span></div>'+
    '<h3>الصوت</h3><p class="hint">كل الكلمات والجمل مسجلة بصوت ألماني طبيعي (متكلم ألماني اصطناعي عالي الجودة)، بسرعتين: عادية وبطيئة. الصوت يعمل بعد أول ضغطة على أي زر استماع.</p>'+
    (!IN_CLAUDE ? '<h3>التثبيت على الهاتف</h3>'+(standalone()?'<p class="hint">التطبيق مثبّت ويعمل من شاشتك الرئيسية.</p>':'<ol class="steps-ol"><li>في Chrome على Android: اضغط ⋮ أعلى الشاشة ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li><li>في Safari على iPhone: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</li><li>على الحاسوب في Chrome: اضغط أيقونة التثبيت في شريط العنوان.</li></ol>') : '')+
    ('caches' in window && !IN_CLAUDE ? '<h3>العمل بدون إنترنت</h3><p class="hint" id="offText">الأصوات تُحفظ تلقائياً كلما استمعت إليها. لتعمل كل الدروس بدون إنترنت نزّلها مرة واحدة (حوالي 14 ميغا).</p><button type="button" class="btn btn-soft" data-act="dl-audio" id="dlBtn">نزّل كل الأصوات</button>' : '')+
    '<h3>نسخة احتياطية للتقدم</h3><p class="hint">لنقل تقدّمك إلى جهاز آخر أو متصفح آخر: انسخ الرمز هنا، ثم الصقه في الإعدادات هناك واضغط «استرجع».</p>'+
    '<button type="button" class="btn btn-ghost" data-act="bk-copy">انسخ رمز التقدم</button>'+
    '<textarea class="bk-in" id="bkIn" rows="3" placeholder="الصق رمز التقدم هنا" aria-label="رمز التقدم"></textarea>'+
    '<button type="button" class="btn btn-ghost" data-act="bk-load">استرجع التقدم من الرمز</button>'+
    '<h3>إعادة الضبط</h3><button type="button" class="btn btn-danger" data-act="reset" id="resetBtn">مسح كل التقدم والبدء من اليوم 1</button>'+
  '</div>';
  sh.hidden=false; syncLabel(); offlineCheck();
}
function closeSheet(){ const sh=$('#sheet'); sh.hidden=true; sh.innerHTML=''; }

/* ---------------- events ---------------- */
function dayCtx(el){ const h=el.closest('[data-day]'); if(h) return +h.dataset.day; if(L) return L.n; return curDay(); }
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='sheet'){ closeSheet(); return; }
  const a=t.closest('[data-act]'), k=t.closest('[data-k]');
  // audio buttons win over row-level actions
  if(k && (!a || a.contains(k) && a!==k)){
    const el = k;
    const slow = k.dataset.slow==='1' || S.set.slow;
    AUDIO.play(+(k.dataset.day||dayCtx(k)), k.dataset.k, {el, slow});
    if(a && a.dataset.act==='vrow' && L && L.hide){ const i=+a.dataset.i; L.peek[i]=1; a.classList.add('peek'); }
    return;
  }
  if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'tab': setTab(a.dataset.tab); break;
    case 'settings': openSettings(); break;
    case 'sheet-close': closeSheet(); break;
    case 'open': openLesson(+a.dataset.n); break;
    case 'pl-close': closeLesson(); break;
    case 'pl-step': goStep(+a.dataset.i); break;
    case 'pl-prev': goStep(L.step-1); break;
    case 'pl-next': goStep(L.step+1); break;
    case 'pl-finish': finishLesson(); break;
    case 'pl-cards': { const n=L.n; closeLesson(); TAB='cards'; startCards(false); if(!CS) render(); break; }
    case 'recall': { const j=+a.dataset.j; L.shown[j]=1; a.classList.add('shown'); AUDIO.play(L.n-1, a.dataset.rk, {el:a.querySelector('.a')}); break; }
    case 'vocab-all': if(VS.on){ vocabStop(); AUDIO.stop(); rerenderBody(); } else vocabAll(); break;
    case 'vocab-hide': L.hide=!L.hide; L.peek={}; rerenderBody(); break;
    case 'vrow': { const i=+a.dataset.i; if(L.hide){ L.peek[i]=1; a.classList.add('peek'); } const v=DAYS[L.n-1].vocab[i]; AUDIO.play(L.n, keyOf(v[0]), {el:a.querySelector('.pbtn'), slow:S.set.slow}); break; }
    case 'ex-open': L.open[+a.dataset.i]=1; rerenderBody(); break;
    case 'ex-grade': { const i=+a.dataset.i; L.ex[i]=a.dataset.r; rerenderBody(); break; }
    case 'rep': L.reps=Math.min(10,L.reps+1); rerenderBody(); if(L.reps===10) toast('ممتاز! الآن اكتبها 3 مرات في دفترك.'); break;
    case 'cs-start': startCards(false); break;
    case 'cs-free': startCards(true); break;
    case 'cs-dir': S.set.dir=a.dataset.dir; commit(); render(); break;
    case 'cs-flip': if(CS && !CS.flip){ CS.flip=true; render(); } break;
    case 'cs-grade': gradeCard(a.dataset.r); break;
    case 'cs-stop': CS.end=true; AUDIO.stop(); render(); break;
    case 'cs-close': CS=null; render(); break;
    case 'ls-day': listenStop(); LS.day=+a.dataset.n; LS.i=0; AUDIO.prefetch(LS.day,false); render(); { const b=$('#lsDays .on'); if(b&&b.scrollIntoView) b.scrollIntoView({inline:'center',block:'nearest'}); } break;
    case 'ls-mode': listenStop(); LS.mode=a.dataset.m; LS.i=0; render(); break;
    case 'ls-toggle': if(LS.playing) listenStop(); else listenLoop(); break;
    case 'ls-next': { const was=LS.playing; listenStop(); LS.i=Math.min(listenItems().length-1,LS.i+1); listenSync(true); if(was) listenLoop(); else AUDIO.play(LS.day, listenItems()[LS.i].k, {el:$('#lsNow .de')}); break; }
    case 'ls-prev': { const was=LS.playing; listenStop(); LS.i=Math.max(0,LS.i-1); listenSync(true); if(was) listenLoop(); else AUDIO.play(LS.day, listenItems()[LS.i].k, {el:$('#lsNow .de')}); break; }
    case 'ls-jump': { const was=LS.playing; listenStop(); LS.i=+a.dataset.i; listenSync(false); if(was) listenLoop(); else AUDIO.play(LS.day, listenItems()[LS.i].k, {el:$('#lsNow .de')}); break; }
    case 'ls-rep': LS.rep=!LS.rep; a.classList.toggle('on',LS.rep); break;
    case 'ls-gap': LS.gap = LS.gap===3?5:LS.gap===5?8:3; a.textContent='مهلة الترديد: '+LS.gap+' ث'; break;
    case 'install': if(installEvt){ installEvt.prompt(); const ev=installEvt; ev.userChoice.then(()=>{ installEvt=null; showInstall(); }).catch(()=>{}); } break;
    case 'dl-audio': downloadAll(a); break;
    case 'bk-copy': { const code=backupCode(), ta=$('#bkIn');
      const show=()=>{ if(ta){ ta.value=code; ta.focus(); ta.select(); } toast('حدّد الرمز وانسخه يدوياً.'); };
      try{ navigator.clipboard.writeText(code).then(()=>toast('نُسخ رمز التقدم. الصقه في الجهاز الآخر.'), show); }catch(e){ show(); } break; }
    case 'bk-load': { const ta=$('#bkIn'); if(restoreCode(ta&&ta.value)){ CS=null; closeSheet(); render(); toast('استُرجع التقدم.'); } else toast('الرمز غير صحيح. انسخه كاملاً وأعد المحاولة.'); break; }
    case 'reset': {
      if(!a.classList.contains('arm')){ a.classList.add('arm'); a.textContent='اضغط مرة أخرى للتأكيد'; clearTimeout(armT); armT=setTimeout(()=>{ a.classList.remove('arm'); a.textContent='مسح كل التقدم والبدء من اليوم 1'; },4000); break; }
      const keep=S.set; S=blank(); S.set=keep; S.u=Date.now(); saveLocal(); try{ localStorage.removeItem('dafk-done'); }catch(e){} if(SYNC.ref) flush();
      CS=null; closeSheet(); TAB='home'; render(); toast('مُسح التقدم. تبدأ من اليوم 1.'); break;
    }
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='setSlow'){ S.set.slow=e.target.checked; commit(); }
  if(e.target.id==='setAuto'){ S.set.auto=e.target.checked; commit(); }
});
document.addEventListener('keydown',e=>{
  const k=e.target.closest && e.target.closest('.de.tap[data-k]');
  if(k && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); k.click(); return; }
  if(e.key==='Escape'){ if(!$('#sheet').hidden) closeSheet(); else if(L) closeLesson(); return; }
  if(TAB==='cards' && CS && !CS.end && !L && $('#sheet').hidden && !/INPUT|TEXTAREA/.test(e.target.tagName)){
    if(e.key===' '){ e.preventDefault(); if(!CS.flip){ CS.flip=true; render(); } }
    else if(CS.flip && e.key==='1') gradeCard('no'); else if(CS.flip && e.key==='2') gradeCard('hard'); else if(CS.flip && e.key==='3') gradeCard('ok');
  }
});

/* ---------------- boot ---------------- */
$('#setBtn').innerHTML=ICON.sliders;
const h=location.hash.replace('#','');
const m=/^day-(\d{1,2})$/.exec(h);
if(['course','cards','listen'].indexOf(h)>=0) TAB=h;
render(); syncLabel();
if(m && +m[1]>=1 && +m[1]<=NDAYS) openLesson(+m[1]);
AUDIO.prefetch(curDay(),false);
initSync();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && !IN_CLAUDE){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();

</script>
