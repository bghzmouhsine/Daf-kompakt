<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202B">
<meta name="description" content="مدرّس ألماني شخصي مبني على كتاب DaF kompakt neu A1">

<title>Deutschstunde A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout concept: a German study notebook — RTL Arabic shell, German content in a DIN-like face, article colour-coding (der/die/das) as the core palette, and a station "Abfahrt" board for the daily hour. */
:root {
  --paper: #F2F4F7; --surface: #FFFFFF; --surface-2: #E9EDF2; --ink: #14202B; --ink-2: #374653; --muted: #63707C; --line: #D8DFE6;
  --accent: #F2B300; --accent-ink: #1C1500; --primary: #14202B; --primary-ink: #FFFFFF; --focus: #F2B300;
  --m: #1F63C6; --f: #CF2E62; --n: #1C8A4C; --p: #7650B4;
  --ok: #0C805A; --ok-bg: #E2F3EB; --bad: #C0410C; --bad-bg: #FCEAE1; --warn-bg: #FFF3D2;
  --board: #0F1E2B; --board-2: #18293A; --board-ink: #EEF3F7; --board-amber: #FFC52E; --board-dim: #8CA0B2;
  --r: 14px; --r-sm: 10px; --shadow: 0 1px 2px rgba(20, 32, 43, .05), 0 8px 24px rgba(20, 32, 43, .06);
  --f-ui: "Readex Pro", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --f-de: "Barlow", "Readex Pro", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D141A; --surface: #151F29; --surface-2: #1C2834; --ink: #E6ECF1; --ink-2: #C1CBD4; --muted: #8C99A5; --line: #263441;
    --accent: #FFC233; --accent-ink: #1C1500; --primary: #E6ECF1; --primary-ink: #0D141A; --focus: #FFC233;
    --m: #77A9FF; --f: #FF7DAA; --n: #5CCF8C; --p: #B898F0;
    --ok: #4BC994; --ok-bg: #12301F; --bad: #FF8C5E; --bad-bg: #3A1E12; --warn-bg: #39300F;
    --board: #08111A; --board-2: #102030; --board-ink: #EEF3F7; --board-amber: #FFC52E; --board-dim: #7F93A6;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D141A; --surface: #151F29; --surface-2: #1C2834; --ink: #E6ECF1; --ink-2: #C1CBD4; --muted: #8C99A5; --line: #263441;
  --accent: #FFC233; --accent-ink: #1C1500; --primary: #E6ECF1; --primary-ink: #0D141A; --focus: #FFC233;
  --m: #77A9FF; --f: #FF7DAA; --n: #5CCF8C; --p: #B898F0;
  --ok: #4BC994; --ok-bg: #12301F; --bad: #FF8C5E; --bad-bg: #3A1E12; --warn-bg: #39300F;
  --board: #08111A; --board-2: #102030; --board-ink: #EEF3F7; --board-amber: #FFC52E; --board-dim: #7F93A6;
  --shadow: 0 1px 0 rgba(255, 255, 255, .02); color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; font-weight: 600; }
h1 { font-size: 1.65rem; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.06rem; }
p { margin: .35em 0; }
small { font-size: .82rem; }
.muted { color: var(--muted); }
.sm { font-size: .86rem; }
.center { text-align: center; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.big { width: 40px; height: 40px; stroke-width: 1.5; }
.de { font-family: var(--f-de); font-size: 1.05em; font-weight: 500; unicode-bidi: isolate; letter-spacing: .005em; }
.g-m { color: var(--m); font-weight: 600; } .g-f { color: var(--f); font-weight: 600; } .g-n { color: var(--n); font-weight: 600; } .g-p { color: var(--p); font-weight: 600; }
b .de, .de b { font-weight: 700; }

/* ---------- shell ---------- */
#app { min-height: 100%; }
#side { display: none; }
#main { min-width: 0; }
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; height: 56px; padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-de); font-size: 1.08rem; letter-spacing: .01em; min-width: 0; }
.top-brand b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-r { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.brand-mark { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--paper); font-family: var(--f-de); font-weight: 700; font-size: 1.15rem; position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset-inline-end: -3px; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--paper); }
.brand-mark.sm { width: 28px; height: 28px; font-size: .95rem; border-radius: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .82rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip .ic { width: 15px; height: 15px; }
.chip.streak .ic { color: var(--accent); }
.chip.lvl { background: var(--surface-2); border-color: transparent; }
.chip.ai { color: var(--ink); background: var(--warn-bg); border-color: transparent; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.sync.cloud { background: var(--ok); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; }
.icon-btn.sm .ic { width: 17px; height: 17px; }
.icon-btn.play { color: var(--m); }
.icon-btn.play.on { background: color-mix(in srgb, var(--m) 14%, transparent); }
.icon-btn.mic { color: var(--f); }
.icon-btn.mic.rec { background: var(--f); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--f) 25%, transparent); } }
#view { padding-block: 18px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 900px; margin-inline: auto; outline: none; }
#tabs { position: fixed; inset: auto 0 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h); border: 0; background: none; color: var(--muted); font-size: .74rem; }
.tab.on { color: var(--ink); }
.tab.on .ic { color: var(--ink); stroke-width: 2.3; }
.tab.on::before { content: ""; position: absolute; }
body.ov #tabs { display: none; }
@media (min-width: 960px) {
  #app { display: grid; grid-template-columns: 268px minmax(0, 1fr); }
  #side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 20px; border-inline-end: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
  #tabs { display: none; }
  .top-brand { display: none; }
  #view { padding-bottom: 60px; }
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { display: block; font-family: var(--f-de); font-size: 1.15rem; letter-spacing: .01em; }
.brand small { color: var(--muted); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-i { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 0; background: none; color: var(--ink-2); text-align: start; font-size: .93rem; }
.nav-i:hover { background: var(--surface-2); }
.nav-i.on { background: var(--ink); color: var(--paper); }
.side-today { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.side-today b { display: block; }

/* ---------- basic components ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 500; font-size: .94rem; text-decoration: none; transition: transform .08s, background .15s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
.btn.good { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.btn.wide { flex: 1; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: .86rem; }
.linkbtn { background: none; border: 0; color: var(--m); padding: 0; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.center { justify-content: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-block: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-block: 12px; box-shadow: var(--shadow); min-width: 0; }
.card.hl { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: linear-gradient(0deg, var(--surface), var(--surface)) padding-box; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.card h3 { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.box { border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 8px 12px; margin-block: 10px; }
.box summary { cursor: pointer; font-weight: 500; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-bg); font-size: .9rem; margin-block: 8px; }
.note .ic { margin-top: 3px; }
.note-card { display: flex; gap: 12px; align-items: flex-start; }
.tipbox { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-bg); margin-top: 10px; }
.tipbox .ic { color: var(--ink); margin-top: 3px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transition: width .4s; }
.bar.good i { background: var(--ok); } .bar.bad i { background: var(--bad); }
.bar.thin { height: 4px; border-radius: 0; }
.bar.thin i { background: var(--accent); border-radius: 0; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--accent); transition: stroke-dashoffset .6s; }
.ring-t { fill: var(--ink); font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.ring { flex: none; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 22px 0 8px; flex-wrap: wrap; }
.sec-h p { margin: 2px 0 0; font-size: .88rem; }
.empty { text-align: center; padding: 30px 12px; color: var(--muted); }
.empty h3 { color: var(--ink); margin: 8px 0 4px; }
.inp { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.inp:focus { border-color: var(--ink); outline: none; }
textarea.inp { resize: vertical; line-height: 1.6; }
.de-inp { font-family: var(--f-de); font-size: 1.08rem; }
.inp.good, .gap-inp.good { border-color: var(--ok); background: var(--ok-bg); }
.inp.bad, .gap-inp.bad { border-color: var(--bad); background: var(--bad-bg); }
.fld { display: flex; flex-direction: column; gap: 5px; margin-block: 6px; font-size: .9rem; min-width: 0; }
.fld > span { color: var(--ink-2); font-weight: 500; }
.form2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 14px; }
.toggle { display: flex; align-items: flex-start; gap: 10px; margin-block: 8px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ink); flex: none; }
.range { width: 100%; accent-color: var(--ink); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.day { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .86rem; }
.day.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.uml { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; direction: ltr; }
.uml-k { min-width: 40px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-de); font-size: 1.08rem; font-weight: 600; }
.uml-k:active { background: var(--accent); }
.clink { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: start; box-shadow: var(--shadow); }
.clink:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.clink-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: var(--surface-2); flex: none; }
.clink.done .clink-ic { background: var(--ok-bg); color: var(--ok); }
.clink.test .clink-ic { background: var(--warn-bg); }
.clink-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.clink-t b { font-weight: 600; }
.clink-t small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chev { color: var(--muted); width: 18px; height: 18px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .84rem; font-family: var(--f-de); }

/* ---------- pages ---------- */
.ph-h { margin-bottom: 10px; }
.ph-h .lead { font-size: 1.08rem; color: var(--ink-2); margin-top: 4px; }
.crumb { background: none; border: 0; padding: 0; color: var(--muted); font-size: .86rem; margin-bottom: 4px; font-family: var(--f-de); }
.crumb::before { content: "‹ "; }
.hero { display: flex; gap: 18px; align-items: center; justify-content: space-between; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); flex-wrap: wrap; }
.hero-t { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hero h1 { font-size: 1.75rem; }
.hero .lead { color: var(--ink-2); }
.hero-ring { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-inline: auto; }
.hero-ring .ring-t { font-size: 24px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-block: 14px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.tile .ic { color: var(--muted); width: 18px; height: 18px; }
.tile b { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile small { color: var(--muted); }
.tile.hot .ic { color: var(--accent); }
.tile.hot b { color: var(--ink); }
.encour { text-align: center; color: var(--muted); margin-top: 18px; }
.tip-de { font-size: 1.15rem; margin-top: 6px; }
.onboard { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }

/* departure board */
.board { background: var(--board); color: var(--board-ink); border-radius: 16px; padding: 14px 14px 8px; margin-block: 14px; overflow: hidden; }
.board-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.board-tt { display: flex; align-items: center; gap: 8px; }
.board-tt b { font-family: var(--f-de); font-size: 1.2rem; letter-spacing: .06em; color: var(--board-amber); text-transform: uppercase; }
.board-tt span { color: var(--board-dim); font-size: .88rem; }
.board-u { font-family: var(--f-mono); font-size: .8rem; color: var(--board-dim); }
.board-cols { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; padding: 8px 6px 2px; color: var(--board-dim); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-family: var(--f-de); }
.board-r { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 9px 6px; border: 0; border-top: 1px dashed rgba(255, 255, 255, .07); background: none; color: inherit; text-align: start; border-radius: 6px; }
.board-r:hover { background: var(--board-2); }
.b-time { font-family: var(--f-mono); font-weight: 600; color: var(--board-amber); font-size: 1rem; font-variant-numeric: tabular-nums; }
.b-dest { display: flex; align-items: center; gap: 8px; min-width: 0; }
.b-dest span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-dest .ic { width: 17px; height: 17px; color: var(--board-dim); }
.b-stat { font-family: var(--f-mono); font-size: .8rem; color: var(--board-dim); white-space: nowrap; }
.board-r.done .b-dest, .board-r.done .b-time { opacity: .45; }
.board-r.done .b-stat { color: #6BD39B; }
.board-r.now { background: var(--board-2); }
.board-r.now .b-stat { color: var(--board); background: var(--board-amber); padding: 1px 8px; border-radius: 4px; font-weight: 600; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }

/* charts */
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 260px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
.chart .ax { fill: var(--muted); font-size: 12px; font-family: var(--f-ui); }
.chart .ax.now { fill: var(--ink); font-weight: 700; }
.chart .goal-t { fill: var(--ink-2); }
.chart .val { fill: var(--ink-2); font-size: 11px; font-family: var(--f-mono); }
.chart .b { fill: color-mix(in srgb, var(--ink) 30%, var(--surface-2)); }
.chart .b.full { fill: var(--ok); }
.chart .b.today { fill: var(--ink); }
.chart .b.today.full { fill: var(--ok); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg-b { border: 0; background: none; padding: 5px 14px; border-radius: 8px; font-size: .88rem; }
.seg-b.on { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 14px; max-width: 420px; }
.hc { display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; border-radius: 7px; font-size: .72rem; font-family: var(--f-mono); color: var(--ink-2); background: var(--surface-2); }
.hc.l1 { background: color-mix(in srgb, var(--accent) 25%, var(--surface-2)); }
.hc.l2 { background: color-mix(in srgb, var(--accent) 50%, var(--surface-2)); }
.hc.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-2)); color: var(--accent-ink); }
.hc.l4 { background: var(--ok); color: #fff; }
.hc.today { outline: 2px solid var(--ink); }
.heat-leg { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.heat-leg .hc { width: 16px; height: 16px; aspect-ratio: auto; }
.skills { display: flex; flex-direction: column; gap: 10px; }
.skill { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 90px; gap: 10px; align-items: center; }
.skill small { text-align: end; font-variant-numeric: tabular-nums; }
.today-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sl { display: flex; flex-direction: column; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; }
.tl { list-style: none; padding: 0; margin: 0; }
.tl li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.t-ok { color: var(--ok); } .t-no { color: var(--bad); } .t-mid { color: var(--ink-2); }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge-a { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line); opacity: .55; }
.badge-a.on { opacity: 1; border-style: solid; background: var(--warn-bg); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.badge-a .ic { width: 26px; height: 26px; }

/* lessons */
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: start; box-shadow: var(--shadow); }
.l-num { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 13px; background: var(--ink); color: var(--paper); font-family: var(--f-de); font-size: 1.5rem; font-weight: 700; flex: none; }
.l-num.big { width: 64px; height: 64px; font-size: 2rem; }
.lesson-card.done .l-num { background: var(--ok); }
.l-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.l-units { display: flex; gap: 6px; }
.uchip { font-family: var(--f-de); font-size: .78rem; padding: 0 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.uchip.half { background: var(--warn-bg); color: var(--ink); }
.uchip.done { background: var(--ok-bg); color: var(--ok); }
.lesson-h { display: flex; gap: 14px; align-items: center; }
.goals { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 6px; }
.goals li { display: flex; gap: 8px; align-items: flex-start; }
.goals .ic { color: var(--ok); margin-top: 3px; width: 18px; height: 18px; }

/* unit steps */
.u-id { display: inline-block; font-family: var(--f-mono); font-size: .95rem; background: var(--accent); color: var(--accent-ink); padding: 1px 8px; border-radius: 7px; vertical-align: middle; }
.steps { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-block: 10px 4px; scrollbar-width: thin; }
.step { display: flex; align-items: center; gap: 6px; padding: 7px 12px 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-size: .9rem; flex: none; }
.s-n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); font-size: .76rem; font-family: var(--f-mono); }
.s-n .ic { width: 14px; height: 14px; stroke-width: 2.6; }
.step.done .s-n { background: var(--ok); color: #fff; }
.step.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.step.on .s-n { background: var(--accent); color: var(--accent-ink); }
.step-nav { margin-top: 18px; gap: 10px; flex-wrap: wrap; }
.gblock { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-block: 12px; min-width: 0; }
.gblock h3 { margin-bottom: 8px; font-size: 1.08rem; }
.gblock p { max-width: 68ch; }
.tscroll { overflow-x: auto; margin-block: 10px; border-radius: 10px; border: 1px solid var(--line); }
.gtable { border-collapse: collapse; width: 100%; font-size: .93rem; }
.gtable th { background: var(--surface-2); font-weight: 600; text-align: start; padding: 8px 10px; white-space: nowrap; }
.gtable td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.gtable td .de { white-space: nowrap; }
.gtable b { color: var(--f); }
.glist { padding-inline-start: 20px; margin: 8px 0; display: grid; gap: 5px; }
.exs { display: grid; gap: 6px; margin-top: 10px; }
.ex { padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.ex-de { display: flex; align-items: center; justify-content: space-between; gap: 8px; direction: ltr; text-align: left; }
.ex-ar { color: var(--muted); font-size: .9rem; }
.vhead { display: flex; flex-direction: column; gap: 10px; }
.vgroup { margin: 18px 0 8px; font-size: 1rem; }
.wlist { display: flex; flex-direction: column; gap: 4px; }
.witem { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.wrow { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.learning { background: var(--accent); } .dot.known { background: var(--ok); }
.w-main { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 6px 0; border: 0; background: none; text-align: start; }
.w-de { direction: ltr; unicode-bidi: isolate; font-size: 1.02rem; }
.w-pl { color: var(--muted); font-size: .84rem; }
.w-ar { color: var(--ink-2); font-size: .92rem; }
.w-ex { padding: 0 14px 10px; }
.w-ex .row { direction: ltr; justify-content: flex-start; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.mode { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); text-align: start; }
.mode.rec { border-color: var(--ink); }
.mode .badge { background: var(--accent); color: var(--accent-ink); margin-top: 4px; }
.scene { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: .92rem; margin: 8px 0; }
.scene .ic { margin-top: 3px; flex: none; }
.script p { direction: ltr; text-align: left; margin: 4px 0; }
.script b { font-family: var(--f-ui); direction: rtl; }
.center-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 26px 16px; }
.sounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sound { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.snd-big { font-family: var(--f-de); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.pairs { display: grid; gap: 8px; margin: 10px 0 14px; }
.pair { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.pbtn .ic { color: var(--m); width: 17px; height: 17px; }
.filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.filters select { width: auto; flex: 1 1 140px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.key { font-family: var(--f-de); padding: 4px 10px; border-radius: 8px; background: var(--surface-2); }
.cards2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ecard { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.ecard b { font-family: var(--f-de); font-size: 1.1rem; }
.reveal { padding: 8px; font-size: .92rem; direction: ltr; }
.checklist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; }
.checklist input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--ok); flex: none; }
.model { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.read-t { font-family: var(--f-de); font-size: 1.08rem; line-height: 1.75; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin-block: 8px; }
.wr-out { margin-block: 10px; }

/* ---------- overlay / sessions ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.session { max-width: 760px; margin-inline: auto; min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ov-h { display: flex; align-items: center; gap: 10px; padding-block: 10px; position: sticky; top: 0; background: var(--paper); z-index: 2; }
.ov-t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.ov-t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { width: 40px; }
.s-body { flex: 1; padding-block: 14px; }
.s-foot { display: flex; gap: 10px; padding-block: 12px 16px; position: sticky; bottom: 0; background: linear-gradient(transparent, var(--paper) 30%); }
.s-foot.sticky { margin-top: auto; }
.it { display: flex; flex-direction: column; gap: 12px; }
.q { font-size: 1.05rem; font-weight: 500; }
.sent { font-family: var(--f-de); font-size: 1.35rem; line-height: 1.7; text-align: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.blank { display: inline-block; min-width: 60px; border-bottom: 2.5px solid var(--accent); margin-inline: 4px; color: transparent; }
.gapline { text-align: left; }
.gap-inp { font-family: var(--f-de); font-size: 1.15rem; padding: 2px 8px; margin: 2px 4px; border-radius: 8px; border: 2px solid var(--accent); background: var(--warn-bg); color: var(--ink); min-width: 60px; max-width: 100%; }
.gap-inp:focus { outline: none; border-color: var(--ink); }
.hint { font-size: .9rem; color: var(--muted); }
.arline { font-size: 1.2rem; font-weight: 500; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.bigword { font-size: 2rem; font-weight: 600; padding: 10px; }
.opts { display: grid; gap: 8px; }
.opts.grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--surface); text-align: start; font-size: 1rem; min-height: 52px; }
.opt[dir="ltr"] { text-align: left; }
.opt .k { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); font-family: var(--f-mono); font-size: .78rem; flex: none; color: var(--muted); }
.opt:hover { border-color: color-mix(in srgb, var(--ink) 40%, var(--line)); }
.opt.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt.good { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.sm { min-height: 38px; padding: 6px 12px; width: auto; font-size: .9rem; }
.opt:disabled { cursor: default; }
.artrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.artbtn { height: 64px; border-radius: 14px; border: 2px solid currentColor; background: var(--surface); font-family: var(--f-de); font-size: 1.4rem; font-weight: 700; }
.artbtn.good { background: var(--ok-bg); box-shadow: 0 0 0 3px var(--ok); }
.artbtn.bad { background: var(--bad-bg); opacity: .8; }
.order-line { min-height: 60px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; border-radius: 14px; border: 2px dashed var(--line); background: var(--surface); }
.order-line.good { border-color: var(--ok); border-style: solid; background: var(--ok-bg); }
.order-line.bad { border-color: var(--bad); border-style: solid; background: var(--bad-bg); }
.order-line .ph { font-size: .88rem; }
.order-pool { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 44px; }
.tok { font-family: var(--f-de); font-size: 1.08rem; padding: 7px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 2px 0 var(--line); }
.tok.in { background: var(--surface-2); box-shadow: none; }
.end { font-family: var(--f-de); font-size: 1.1rem; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mt { padding: 10px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); text-align: center; min-height: 48px; font-size: .95rem; overflow-wrap: anywhere; }
.mt.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.mt.paired { border-width: 2px; }
.mt.c1 { border-color: var(--m); background: color-mix(in srgb, var(--m) 10%, var(--surface)); }
.mt.c2 { border-color: var(--f); background: color-mix(in srgb, var(--f) 10%, var(--surface)); }
.mt.c3 { border-color: var(--n); background: color-mix(in srgb, var(--n) 10%, var(--surface)); }
.mt.c4 { border-color: var(--p); background: color-mix(in srgb, var(--p) 10%, var(--surface)); }
.mt.c5 { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.mt.c6 { border-color: var(--ink-2); background: var(--surface-2); }
.mt.good { box-shadow: 0 0 0 2px var(--ok); }
.mt.bad { box-shadow: 0 0 0 2px var(--bad); }
.listen-tools { margin-block: 4px; }
.big-play { min-height: 54px; padding: 10px 22px; border-radius: 16px; background: var(--m); color: #fff; font-size: 1.02rem; }
.big-play .ic { width: 22px; height: 22px; }
.read-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tr-box { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); font-size: .92rem; }
.rq { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rq-s { direction: ltr; text-align: left; }
.rq-b { display: flex; gap: 6px; flex-wrap: wrap; }
.fb { margin-block: 6px 4px; padding: 14px; border-radius: 14px; border: 1.5px solid; display: flex; flex-direction: column; gap: 6px; animation: rise .2s ease-out; }
.fb.ok { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: var(--ok-bg); }
.fb.no { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
.fb-h { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.fb.ok .fb-h { color: var(--ok); } .fb.no .fb-h { color: var(--bad); }
.fb-h .ic { width: 22px; height: 22px; stroke-width: 2.6; }
.fb-r { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fb-why { color: var(--ink); margin: 2px 0; }
.fb-note { display: flex; gap: 6px; align-items: flex-start; color: var(--ink-2); font-size: .9rem; }
.fb-note .ic { width: 16px; height: 16px; margin-top: 4px; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } }
.diff { font-family: var(--f-de); font-size: 1.05rem; padding: 6px 8px; border-radius: 8px; background: var(--surface); text-align: left; }
.dw.ok { color: var(--ok); }
.dw.no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.ai-out { padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .93rem; }
.ai-out.big { margin-top: 12px; min-height: 80px; line-height: 1.8; }
.thinking { display: flex; gap: 6px; align-items: center; }
.thinking .ic { animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.result { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px 0 10px; }
.result .ring-t { font-size: 26px; }
.result.small { padding: 10px 0; }
.result.small .ring-t { font-size: 20px; }
.pass { color: var(--ok); font-weight: 600; } .fail { color: var(--bad); font-weight: 600; }
.mistakes { display: flex; flex-direction: column; gap: 8px; margin-block: 12px; }
.mistakes h3 { margin-bottom: 4px; }
.mrow { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.mrow-q { font-weight: 500; }
.mrow-a { display: flex; align-items: center; gap: 6px; }
.mrow-a .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.mrow-a.bad { color: var(--bad); } .mrow-a.good { color: var(--ok); }
.fcard { margin: 6px auto; max-width: 520px; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; cursor: pointer; }
.fc-type { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.fc-word { font-size: 2.2rem; font-weight: 600; font-family: var(--f-de); direction: ltr; line-height: 1.25; overflow-wrap: anywhere; }
.fc-back { display: flex; flex-direction: column; gap: 6px; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; width: 100%; }
.fc-ar { font-size: 1.35rem; font-weight: 600; }
.fc-ex { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.fc-ex .row { direction: ltr; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; }

/* dialogue */
.dlg-log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }
.bub { max-width: 88%; padding: 10px 12px; border-radius: 16px; position: relative; display: flex; flex-direction: column; gap: 3px; animation: rise .2s ease-out; }
.bub .who { font-size: .74rem; color: var(--muted); }
.bub.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-start-start-radius: 4px; }
.bub.me { align-self: flex-end; background: var(--surface-2); border-start-end-radius: 4px; }
.bub.me.ok { background: var(--ok-bg); } .bub.me.no { background: var(--bad-bg); }
.b-de { font-size: 1.08rem; text-align: left; direction: ltr; }
.b-tr { font-size: .88rem; color: var(--muted); }
.b-tools { display: flex; gap: 2px; margin-inline-start: -6px; }
.b-st { position: absolute; inset-inline-start: -10px; top: -8px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
.b-st .ic { width: 13px; height: 13px; stroke-width: 3; }
.bub.ok .b-st { color: var(--ok); } .bub.no .b-st { color: var(--bad); }
.b-fix { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 4px; }
.b-ex { font-size: .88rem; color: var(--ink-2); }
.b-ex.tip { display: flex; gap: 4px; align-items: flex-start; }
.b-ex.tip .ic { width: 15px; height: 15px; margin-top: 4px; }
.dlg-panel { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding-block: 10px 14px; background: linear-gradient(transparent, var(--paper) 18px); }
.task { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); font-size: .95rem; }

/* pronunciation */
.pron { display: flex; flex-direction: column; gap: 8px; }
.pr-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 14px; }
.pr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; direction: ltr; }
.pr-t { font-size: 1.06rem; text-align: left; flex: 1; min-width: 0; }
.pr-b { display: flex; gap: 2px; flex: none; }
.pr-res { padding: 6px 4px 2px; display: flex; flex-direction: column; gap: 4px; }
.pr-res .t-ok, .pr-res .t-mid, .pr-res .t-no { font-family: var(--f-mono); font-size: 1.1rem; }
